# All-In-One (allin1, MIT) for Songlab reference sections, in its own environment so its pins (torch 2.4,
# numpy < 2, madmom from git) never touch Pain Cave's. NATTEN is replaced by natten_torch.py, which runs on
# Apple's GPU; the override below keeps the real one (a CUDA-era source build) out.
[project]
name = "paincave-allin1"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "allin1==1.1.0",
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "numpy<2",
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e",
    "soundfile",
    "certifi",
]

[tool.uv]
package = false
override-dependencies = ["natten; sys_platform == 'never'"]
