[project]
name = "paincave-analysis"
version = "3.0.0"
description = "Audio analysis tools for Pain Cave spin class workouts"
requires-python = ">=3.11"
dependencies = [
    "beat_this @ git+https://github.com/CPJKU/beat_this@v1.1.0",
    "torch==2.14.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "jsonschema>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
# Songlab reference analysis only (bin/analyze-reference); Pain Cave's import never installs or loads it.
reference = [
    "demucs==4.0.1",
    "certifi",
]
